executor: slurm
jobs: 75
use-singularity: true
singularity-args: '-B /home -B /projects -B /scratch --env "PREPEND_PATH=/opt/conda/bin"'
latency-wait: 300
restart-times: 2
rerun-incomplete: true
default-resources:
  slurm_account: "jingke.weng"
  slurm_partition: "long"
  tmpdir: "/tmp"
set-resources:
  check_bam_sorted:
    slurm_partition: "short"
    runtime: 240
  bam2hints:
    slurm_partition: "short"
    runtime: 240
