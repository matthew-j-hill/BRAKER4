; Shared biology configuration for all local (no-SLURM) test scenarios.
;
; Every scenario in test_scenarios_local/ uses this single file via the
; BRAKER4_CONFIG environment variable (set by run_test.sh). Per-scenario
; deviations from these defaults are expressed as BRAKER4_* environment
; variable overrides in each scenario's scenario_overrides.sh.
;
; The compute side of the configuration (cpus_per_task, mem_of_node,
; max_runtime, etc.) lives in compute_profile.sh, NOT here.

[paths]
samples_file = samples.csv
augustus_config_path = augustus_config
tmp_dir = /tmp

[PARAMS]
run_best_by_compleasm = 1
run_omark = 0
skip_optimize_augustus = 1
skip_single_exon_downsampling = 0
downsampling_lambda = 2
downsampling_single_exon_skip_threshold = 95
use_varus = 0
use_compleasm_hints = 1
skip_busco = 0
use_dev_shm = 0
gm_max_intergenic = 10000
no_cleanup = 0
run_ncrna = 0

[containers]
braker3_image = /projects/wenglab/testtube/matthew/singularity/braker3_v3.1.3.sif
agat_image = /projects/wenglab/testtube/matthew/singularity/agat_1.4.1--pl5321hdfd78af_0.sif
busco_image = /projects/wenglab/testtube/matthew/singularity/busco_v6.1.0_cv2.sif
omark_image = /projects/wenglab/testtube/matthew/singularity/omark_0.4.1--pyh7e72e81_0.sif
